id = "phoxite.laravel"
name = "Laravel (Phoxite)"
version = "0.1.0"
description = "Laravel tools for projects served by the Phoxite language server."
authors = ["Phoxite contributors"]
license = "Apache-2.0"
engines.openidea = "^1.9"
wasm = "dist/plugin.wasm"
activation = ["on-command:*"]

[capabilities]
# Everything comes from phoxite-lsp's own `phoxite/laravel/*` requests. The view names
# files relative to the project, and remembers which model it shows.
required = ["lsp:phoxite", "project.read", "storage"]
# project.write: the generators, Add Columns and Create translation key write files.
# editor.read / editor.write: a file with unsaved changes is edited in its editor.
# process:php: Run Artisan Command.
optional = ["project.write", "editor.read", "editor.write", "process:php"]

[[contributes.commands]]
id = "go-to-route"
title = "Laravel: Go to Route…"

[[contributes.commands]]
id = "refresh-routes"
title = "Laravel: Refresh Routes"

[[contributes.commands]]
id = "run-artisan"
title = "Laravel: Run Artisan Command…"

[[contributes.commands]]
id = "show-model"
title = "Laravel: Show Eloquent Model…"

[[contributes.commands]]
id = "generate"
title = "Laravel: Generate…"

[[contributes.commands]]
id = "new-model"
title = "Laravel: New Eloquent Model…"

# The four below run when a lens or an action of the server is clicked.
[[contributes.commands]]
id = "route-actions"
title = "Laravel: Go to the Routes of This Method"

[[contributes.commands]]
id = "model-view"
title = "Laravel: Show This Eloquent Model"

[[contributes.commands]]
id = "run-artisan-lens"
title = "Laravel: Run This Artisan Command"

[[contributes.commands]]
id = "create-translation"
title = "Laravel: Create Translation Key…"

[[contributes.views]]
id = "routes"
title = "Laravel Routes"
icon = "server"
location = "left"

[[contributes.views]]
id = "model"
title = "Eloquent Model"
icon = "server"
location = "right"

# phoxite-lsp's lenses, hints and actions carry these commands and leave running them
# to the client (`docs/editors.md`).
[[contributes.serverCommands]]
server = "phoxite"
command = "laravel.routeActions"
run = "route-actions"

[[contributes.serverCommands]]
server = "phoxite"
command = "laravel.modelView"
run = "model-view"

[[contributes.serverCommands]]
server = "phoxite"
command = "laravel.runArtisan"
run = "run-artisan-lens"

[[contributes.serverCommands]]
server = "phoxite"
command = "laravel.createTranslation"
run = "create-translation"
