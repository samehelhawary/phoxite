[package]
name = "phoxite-openidea"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# A plugin builds on its own (target wasm32-wasip2), outside the Phoxite workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Plugin API 1.9 (the `language-servers` interface) is not released yet: the SDK is pinned
# to the OpenIDEA commit that added it.
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", rev = "feb261d17" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
