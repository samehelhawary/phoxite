version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # Mago's crates are pinned to one version and move together.
      mago:
        patterns: ["mago-*"]
      rust:
        patterns: ["*"]
        exclude-patterns: ["mago-*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /editors/openidea
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
