name: Release

# A `v*` tag builds the server for each platform, packages a platform-specific VSIX for
# each, and attaches both to a draft GitHub release. Publishing that release sends the
# packages to the extension stores (publish.yml).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A tag that doesn't state the version of the manifests, or a version the changelog
  # doesn't describe, builds nothing.
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - if: github.ref_type == 'tag'
        run: node scripts/check_versions.mjs "$GITHUB_REF_NAME"
      - if: github.ref_type != 'tag'
        run: node scripts/check_versions.mjs

  build:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest, exe: .exe }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, exe: .exe }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04, musl: true }
          # Both on the current macOS runner (Apple silicon): the Intel build is cross-compiled.
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p phoxite-lsp --target ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Package the extension
        shell: bash
        run: |
          cd editors/vscode && npm ci && npm run vscode:prepublish && cd ../..
          node scripts/package_vscode.mjs \
            --server target/${{ matrix.target }}/release/phoxite-lsp${{ matrix.exe }} \
            --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/phoxite-lsp${{ matrix.exe }} \
            dist/phoxite-lsp-${{ matrix.target }}${{ matrix.exe }}
          cp editors/vscode/*.vsix dist/
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums of the server binaries
        # One `<binary>.sha256` beside each binary, for installers that verify the download.
        run: |
          cd dist
          for binary in phoxite-lsp-*; do sha256sum "$binary" > "$binary.sha256"; done
      - name: Licences of the Rust dependencies
        run: |
          cargo install --locked cargo-about --features cli
          cargo about generate --workspace -o dist/THIRD_PARTY_RUST_LICENSES.html about.hbs
      - name: Stable or pre-release
        # An odd minor (0.5.x) is a pre-release: its packages were built as one, and its
        # GitHub release is marked so, which also keeps it from being the latest release
        # (OpenIDEA installs the server from that).
        id: channel
        run: |
          minor="$(echo "${GITHUB_REF_NAME#v}" | cut -d. -f2)"
          case "$minor" in *[13579]) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ steps.channel.outputs.prerelease }}
          files: dist/*
