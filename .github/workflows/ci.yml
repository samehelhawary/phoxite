name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request replaces the run of the one before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The links of the documentation name what is there. (Public text may name a
      # private item: the documentation is read with the private items in it.)
      - run: cargo doc --workspace --no-deps --locked --document-private-items
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: -D warnings -A rustdoc::private_intra_doc_links

  # The oldest Rust the manifests promise (`rust-version`) still builds it.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  # Known vulnerabilities in the dependencies, and their licences (deny.toml).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The tag, the manifests and the changelog state one version.
      - run: node ../../scripts/check_versions.mjs
      # docs/settings.md says what the schema of `phoxite.json` does.
      - run: node ../../scripts/settings_doc.mjs --check

  # The extension in a real VS Code, with a server built here: the end-to-end suite, and
  # the package as a release would make it.
  vscode-e2e:
    strategy:
      fail-fast: false
      matrix:
        # Windows too: its paths (drive letters, backslashes) take their own code.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p phoxite-lsp
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: editors/vscode
      - uses: actions/cache@v4
        with:
          path: editors/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('editors/vscode/package-lock.json') }}
      - name: End-to-end suite
        if: runner.os == 'Linux'
        working-directory: editors/vscode
        env:
          PHOXITE_SERVER: ${{ github.workspace }}/target/debug/phoxite-lsp
        run: xvfb-run -a npm run test:e2e
      - name: End-to-end suite (Windows)
        if: runner.os == 'Windows'
        working-directory: editors/vscode
        env:
          PHOXITE_SERVER: ${{ github.workspace }}/target/debug/phoxite-lsp.exe
        run: npm run test:e2e
      # The grammar tests need VS Code's own grammars, which the run above downloaded.
      - name: Grammar tests
        working-directory: editors/vscode
        run: node --test --experimental-strip-types test/grammar.test.mts
      - name: Package (dry run)
        if: runner.os == 'Linux'
        run: |
          cd editors/vscode && npm run vscode:prepublish && cd ../..
          node scripts/package_vscode.mjs --server target/debug/phoxite-lsp --target linux-x64
          ls -l editors/vscode/*.vsix

  # Format Document through a real Laravel Pint: the runners have PHP and Composer.
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: A project that installs Pint
        run: |
          mkdir -p "$RUNNER_TEMP/pint-project" && cd "$RUNNER_TEMP/pint-project"
          echo '{ "name": "phoxite/pint-check" }' > composer.json
          composer require --dev --no-interaction laravel/pint
          php --version && php vendor/bin/pint --version
      - run: cargo test -p phoxite-lsp -- --ignored a_real_pint
        env:
          PHOXITE_REAL_PINT: ${{ runner.temp }}/pint-project

  # The OpenIDEA plugin is its own crate, outside the workspace: a WebAssembly component.
  openidea:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/openidea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editors/openidea
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --target wasm32-wasip2 -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release --target wasm32-wasip2

  # The performance budgets (crates/phoxite/benches/shared/workload.rs) on the fixture and on
  # laravel/framework. A shared machine is slower than the ones the budgets were set on, and
  # uneven: the medians may be three times the budget before this fails.
  budgets:
    runs-on: ubuntu-latest
    env:
      PHP_CORPUS_DIR: ${{ github.workspace }}/php-corpus
      PHOXITE_BUDGET_FACTOR: 3
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/php-corpus.sh laravel-framework
      - run: cargo test --locked --release -p phoxite --test budgets -- --ignored --nocapture
      # What was measured, kept to set a slower run beside an earlier one.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budgets
          path: target/php-budgets.json
          if-no-files-found: ignore

  bench:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p phoxite --bench engine -- --quick
