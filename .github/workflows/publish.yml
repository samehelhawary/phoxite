name: Publish

# Publishing a GitHub release sends its VSIX packages to the extension stores. The VS Code
# Marketplace takes them through Trusted Publishing: the publisher has a policy naming this
# repository and this workflow file, so no token is stored. It runs once the repository
# variable MARKETPLACE_PUBLISH is `true`. Open VSX runs when its token is configured
# (OVSX_PAT).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release whose packages to publish, as its tag (v0.1.0)
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Only the releases of the server and the extension (`v0.2.1`): the OpenIDEA plugin has
    # its own (`openidea-plugin-v0.1.0`), which carry no extension packages.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Download the packages of the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.vsix" --dir dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Stable or pre-release
        # A release marked as a pre-release on GitHub (an odd minor, release.yml) goes to
        # the stores' pre-release channel.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = "true" ]; then
            echo "CHANNEL=--pre-release" >> "$GITHUB_ENV"
          fi
      - name: Publish to the VS Code Marketplace
        if: vars.MARKETPLACE_PUBLISH == 'true'
        run: npx @vscode/vsce@4.1.1 publish --oidc --skip-duplicate $CHANNEL --packagePath dist/*.vsix
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: for vsix in dist/*.vsix; do npx ovsx@1.4.0 publish "$vsix" --skip-duplicate $CHANNEL -p "$OVSX_PAT"; done
