[workspace]
resolver = "3"
members = ["crates/phoxite", "crates/phoxite-lsp"]

[workspace.package]
version = "0.12.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
authors = ["Sameh Elhawary"]
repository = "https://github.com/samehelhawary/phoxite"

[workspace.dependencies]
phoxite = { path = "crates/phoxite", version = "0.12.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["alloc"] }
parking_lot = "0.13"
rayon = "1"
stacker = "0.1"
tracing = "0.1"
self_cell = "1"
ignore = "0.4"
globset = "0.4"
blake3 = "1"
dunce = "1"
zip = { version = "9.2.3", default-features = false, features = ["deflate"] }
nucleo-matcher = "0.3"
redb = "4"
insta = { version = "1", features = ["yaml"] }
tempfile = "3"
tokio-util = "0.7"
lsp-server = "0.7"
lsp-types = "0.95.1"
crossbeam-channel = "0.5"
url = "2"
rusqlite = { version = "0.42", features = ["bundled"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "debuginfo"
